{% extends "base.html" %}

{% block styles %}
  {{ super() }}
  <!-- 直接嵌入CSS代码 -->
  <style>
    /* 调整内容区宽度 */
    .wy-nav-content {
      max-width: 90% !important;
    }
  </style>
{% endblock %}

{% block footer %}
  {{ super() }}
  <script>
    // 等待页面加载完成后渲染 KaTeX 公式
    document.addEventListener("DOMContentLoaded", function() {
      renderMathInElement(document.body, {
        // customised options
        // • auto-render specific keys, e.g.:
        delimiters: [
            { left: '$$', right: '$$', display: true },
            { left: '$', right: '$', display: false },
            { left: '\\(', right: '\\)', display: false },
            { left: '\\[', right: '\\]', display: true }
        ],
        // • rendering keys, e.g.:
        throwOnError: false
      });
    });
  </script>
{% endblock %}
